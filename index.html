<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin Swann</title>
  <meta name="description" content="The personal website of Justin Swann.">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --accent: #2a5db0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #f0f0f0;
        --muted: #a0a0a0;
        --accent: #7aa7ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 15vh 16px 64px;
    }
    h1 {
      font-size: 2.25rem;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 1rem; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    footer {
      margin-top: 4rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Justin Swann</h1>
    <p class="muted">This site is under construction.</p>
    <p>A new home for my work is on the way. Check back soon.</p>
    <footer>&copy; 2026 Justin Swann</footer>
  </main>
</body>
</html>
